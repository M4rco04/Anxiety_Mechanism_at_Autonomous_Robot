[project]
name = "anxiety-mechanism-at-autonomous-robot"
version = "0.1.0"
description = "Anxiety mechanism simulation for autonomous Mars rovers (Mesa + Perlin Noise)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mesa<3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "perlin-noise",
    "networkx>=3.1",
]

[project.scripts]
# `uv run server` -> serwer WWW z wizualizacją 3D terenu
server = "server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Projekt nie jest biblioteką - instalowane są tylko pakiety potrzebne
# do działania skryptów (importy `src.*` i `server.*`).
packages = ["src", "server"]
